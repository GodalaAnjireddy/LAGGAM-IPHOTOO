<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event admin | LAGGAM IPHOTOO</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><div class="logo">LI</div><b>LAGGAM IPHOTOO</b><span>Under Srilekha Photography</span><span>Event dashboard</span></nav><main><section class="panel"><h1 id="title"></h1><p>Upload camera photos or synchronize a folder on the photographer laptop.</p><h2>Manual photo upload</h2><form id="upload"><label>Choose photos<input type="file" name="file" accept="image/*" multiple required></label><button>Upload selected</button></form><h2>Local Nikon folder sync</h2><form id="sync"><label>Folder path on this computer<input name="folder" placeholder="C:\Photos\Wedding" required></label><button>Copy new photos</button></form><p id="status"></p><h2>Guest QR</h2><img id="qr" class="qr" src="/api/events/__ID__/qr"><p><a href="/event/__ID__">Open guest page</a></p><h2>Gallery</h2><div id="gallery" class="gallery"></div></section></main><script>const ev=__EVENT__,id='__ID__';document.querySelector('#title').textContent=ev.name;async function refresh(){let r=await fetch(`/api/events/${id}/photos`),a=await r.json();document.querySelector('#gallery').innerHTML=a.map(x=>`<article><img src="${x.url}"><a download href="${x.url}">Download</a></article>`).join('')}refresh();document.querySelector('#upload').onsubmit=async e=>{e.preventDefault();let files=e.target.file.files,s=document.querySelector('#status');for(let f of files){let fd=new FormData();fd.append('file',f);await fetch(`/api/events/${id}/upload`,{method:'POST',body:fd})}s.textContent='Upload complete';refresh()};document.querySelector('#sync').onsubmit=async e=>{e.preventDefault();let r=await fetch(`/api/events/${id}/sync-folder`,{method:'POST',body:new FormData(e.target)}),d=await r.json();document.querySelector('#status').textContent=d.copied!==undefined?`${d.copied} new photos copied`:d.detail;refresh()};</script></body></html>
