services:
  - type: web
    name: laggam-iphotOO
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PHOTOO_DATA
        value: /var/data
    disk:
      name: laggam-iphotOO-storage
      mountPath: /var/data
      sizeGB: 10
